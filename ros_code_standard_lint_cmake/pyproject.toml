[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros-code-standard-lint-cmake"
version = "0.1.0"
description = "Pinned cmakelint with ROS 2 CMake rules"
requires-python = ">=3.10"
dependencies = [
    "cmakelint==1.4.3",
]

[project.scripts]
ros-code-standard-lint-cmake = "ros_code_standard_lint_cmake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ros_code_standard_lint_cmake"]
dev-mode-dirs = ["src"]
