[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros-code-standard-xmllint"
version = "0.1.0"
description = "Offline ROS 2 XML and package.xml schema validator"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0.0",
]

[project.scripts]
ros-code-standard-xmllint = "ros_code_standard_xmllint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ros_code_standard_xmllint"]
dev-mode-dirs = ["src"]
